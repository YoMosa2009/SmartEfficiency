<text x="82" y="497" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="14" font-weight="700" fill="#17241F">platform.Backend</text>
<text x="82" y="518" text-anchor="start" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B64">Windows: EcoQoS · EmptyWorkingSet</text>
<text x="82" y="537" text-anchor="start" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B64">Linux: nice · xdotool (X11 only)</text>
