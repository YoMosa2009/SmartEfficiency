<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-labelledby="t d">
<title id="t">SmartEfficiency architecture</title>
<desc id="d">The OS service manager starts smarteffd and smarteff-tray. They communicate only through status.json and config.json, watch each other by PID file, and launch the short-lived smarteff-update helper, which reads GitHub Releases.</desc>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#5B6B64"/></marker>
<marker id="g" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#16A34A"/></marker></defs>
<rect width="1280" height="600" rx="18" fill="#F5F7F6"/>
<text x="40" y="46" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="700" fill="#17241F">How the pieces fit</text>
<text x="40" y="72" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#5B6B64">three binaries · no sockets or pipes between them — two JSON files, written atomically (temp file + rename)</text>
<rect x="300" y="96" width="680" height="60" rx="14" fill="#FFFFFF" stroke="#E2E8E4" stroke-width="1.5"/>
<text x="640" y="121" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="15" font-weight="700" fill="#17241F">OS service manager</text>
<text x="640" y="143" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B64">Task Scheduler (RestartOnFailure) · systemd --user (Restart=always) · launchd (KeepAlive)</text>
<line x1="400" y1="158" x2="260" y2="206" stroke="#5B6B64" stroke-width="1.8" marker-end="url(#a)"/>
<line x1="880" y1="158" x2="1020" y2="206" stroke="#5B6B64" stroke-width="1.8" marker-end="url(#a)"/>
<text x="300" y="190" text-anchor="middle" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12" font-weight="400" fill="#5B6B64">start at login, restart on crash</text>
<rect x="60" y="208" width="400" height="232" rx="14" fill="#FFFFFF" stroke="#16A34A" stroke-width="1.5"/>
<rect x="60" y="208" width="400" height="44" rx="14" fill="#DCFCE7"/><rect x="60" y="238" width="400" height="14" fill="#DCFCE7"/>
<text x="82" y="236" text-anchor="start" font-family="ui-monospace, 'Cascadia Code', Consolas, Menlo, monospace" font-size="17" font-weight="700" fill="#17241F">smarteffd</text>
<text x="440" y="236" text-anchor="end" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B64">background daemon</text>
<circle cx="86" cy="276" r="3.5" fill="#16A34A"/>
<text x="98" y="281" text-anchor="start" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17241F">poll every 15 s (PollIntervalSeconds)</text>
<circle cx="86" cy="303" r="3.5" fill="#16A34A"/>
<text x="98" y="308" text-anchor="start" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17241F">find the focused app → keep it normal</text>
<circle cx="86" cy="330" r="3.5" fill="#16A34A"/>
<text x="98" y="335" text-anchor="start" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17241F">idle / RAM pressure → efficiency tier</text>
<circle cx="86" cy="357" r="3.5" fill="#16A34A"/>
<text x="98" y="362" text-anchor="start" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17241F">trim memory (Windows · size-capped)</text>
<circle cx="86" cy="384" r="3.5" fill="#16A34A"/>
<text x="98" y="389" text-anchor="start" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17241F">timer-resolution watch · weekly energy audit</text>
