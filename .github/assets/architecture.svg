<text x="556" y="261" text-anchor="start" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B64">daemon → everyone</text>
