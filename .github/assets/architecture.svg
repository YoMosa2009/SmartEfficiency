<text x="1200" y="236" text-anchor="end" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="12.5" font-weight="400" fill="#5B6B64">tray icon + dashboard</text>
<circle cx="846" cy="276" r="3.5" fill="#16A34A"/>
<text x="858" y="281" text-anchor="start" font-family="'Segoe UI', Inter, -apple-system, Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="13.5" font-weight="400" fill="#17241F">tray menu: pause / resume, open dashboard</text>
