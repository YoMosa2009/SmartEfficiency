<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>SmartEfficiency</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --bg: #f5f7f6;
    --card-bg: #ffffff;
    --text: #17241f;
    --text-dim: #5b6b64;
    --border: #e2e8e4;
    --accent: #16a34a;
    --accent-dim: #dcfce7;
    --warn: #d97706;
    --warn-dim: #fef3c7;
    --danger: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #101512;
      --card-bg: #1a211d;
      --text: #eaf2ee;
      --text-dim: #8fa199;
      --border: #2a332e;
      --accent: #22c55e;
      --accent-dim: #143322;
      --warn: #f59e0b;
      --warn-dim: #3a2c0d;
      --danger: #ef4444;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.5 -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 28px 20px 60px;
  }
  .wrap { max-width: 560px; margin: 0 auto; }
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }
  .dot {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 4px var(--accent-dim);
    flex-shrink: 0;
  }
  .dot.off { background: var(--text-dim); box-shadow: 0 0 0 4px var(--border); }
  h1 { font-size: 18px; margin: 0; font-weight: 600; }
  .sub { color: var(--text-dim); font-size: 12px; margin-top: 2px; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 20px;
    margin-bottom: 14px;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 9px 0;
    border-bottom: 1px solid var(--border);
  }
  .row:last-child { border-bottom: none; }
  .label { color: var(--text-dim); }
  .value { font-weight: 600; font-variant-numeric: tabular-nums; }
  .value.warn { color: var(--warn); }
  .value.danger { color: var(--danger); }

  .toggle-row { display: flex; justify-content: space-between; align-items: center; }
  .toggle {
    position: relative; width: 46px; height: 26px;
    background: var(--border); border-radius: 999px; border: none;
    cursor: pointer; flex-shrink: 0; transition: background .15s;
  }
  .toggle.on { background: var(--accent); }
  .toggle::after {
    content: ""; position: absolute; top: 3px; left: 3px;
    width: 20px; height: 20px; border-radius: 50%; background: #fff;
    transition: transform .15s;
  }
  .toggle.on::after { transform: translateX(20px); }

  button.action {
    width: 100%;
    padding: 11px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    margin-top: 6px;
  }
  button.action:hover { border-color: var(--accent); }
  button.action:disabled { opacity: .5; cursor: default; }

  .banner {
    display: none;
    padding: 12px 16px;
    border-radius: 10px;
    background: var(--warn-dim);
    color: var(--warn);
    font-weight: 600;
    margin-bottom: 14px;
    font-size: 13px;
  }
  .banner.show { display: block; }

  footer { text-align: center; color: var(--text-dim); font-size: 11px; margin-top: 20px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dot" id="statusDot"></div>
    <div>
      <h1>SmartEfficiency</h1>
      <div class="sub" id="statusSub">loading...</div>
    </div>
  </header>

  <div class="banner" id="updateBanner"></div>

  <div class="card">
    <div class="toggle-row">
      <div>
        <div style="font-weight:600">Monitoring</div>
        <div class="sub" id="toggleSub">-</div>
      </div>
      <button class="toggle" id="toggleBtn" onclick="toggleEnabled()"></button>
    </div>
  </div>

  <div class="card">
    <div class="row"><span class="label">Battery</span><span class="value" id="battery">-</span></div>
    <div class="row"><span class="label">Power source</span><span class="value" id="power">-</span></div>
    <div class="row"><span class="label">RAM usage</span><span class="value" id="ram">-</span></div>
    <div class="row"><span class="label">Currently throttled</span><span class="value" id="throttled">-</span></div>
    <div class="row"><span class="label">RAM freed today</span><span class="value" id="freed">-</span></div>
    <div class="row"><span class="label">Foreground app</span><span class="value" id="foreground">-</span></div>
  </div>

  <div class="card">
    <div class="row"><span class="label">Timer resolution</span><span class="value" id="timerRes">-</span></div>
    <div class="row"><span class="label">Energy audit</span><span class="value" id="energyAudit">-</span></div>
    <div id="energyIssues" class="sub" style="margin-top:8px; display:none; line-height:1.6;"></div>
  </div>

  <div class="card">
    <div class="row"><span class="label">Version</span><span class="value" id="version">-</span></div>
    <div class="row"><span class="label">Platform backend</span><span class="value" id="backend">-</span></div>
    <div class="row"><span class="label">Last update</span><span class="value" id="updated">-</span></div>
    <button class="action" id="checkBtn" onclick="checkForUpdate()">Check for updates</button>
  </div>

  <footer>SmartEfficiency &middot; <span id="footerVersion"></span></footer>
</div>

<script>
let currentEnabled = null;

function fmtAgo(iso) {
  const d = new Date(iso);
  if (isNaN(d)) return '-';
  const secs = Math.max(0, Math.round((Date.now() - d.getTime()) / 1000));
  if (secs < 5) return 'just now';
  if (secs < 60) return secs + 's ago';
  return Math.round(secs / 60) + 'm ago';
}

async function refresh() {
  try {
    const res = await fetch('/api/status');
    const s = await res.json();
    currentEnabled = s.Enabled;

    document.getElementById('statusDot').className = 'dot' + (s.Enabled ? '' : ' off');
    document.getElementById('statusSub').textContent = s.Enabled ? 'Active' : 'Paused';
    document.getElementById('toggleBtn').className = 'toggle' + (s.Enabled ? ' on' : '');
    document.getElementById('toggleSub').textContent = s.Enabled
      ? 'Watching background apps'
      : 'Not throttling anything right now';

    document.getElementById('battery').textContent = s.BatteryPercent >= 0 ? s.BatteryPercent + '%' : 'n/a';
    document.getElementById('power').textContent = s.OnBattery ? 'On battery' : 'Plugged in';

    const ramEl = document.getElementById('ram');
    ramEl.textContent = s.RamPercent >= 0 ? s.RamPercent + '%' : 'n/a';
    ramEl.className = 'value' + (s.HighPressure ? ' warn' : '');

    document.getElementById('throttled').textContent = s.ThrottledCount + ' process(es)';
    document.getElementById('freed').textContent = (s.RamFreedTodayMB || 0).toFixed(0) + ' MB';
    document.getElementById('foreground').textContent = s.ForegroundName || 'n/a';

    const timerResEl = document.getElementById('timerRes');
    if (s.TimerResolutionMs > 0) {
      timerResEl.textContent = s.TimerResolutionMs.toFixed(2) + 'ms' + (s.TimerResolutionElevated ? ' (elevated - costing battery)' : ' (normal)');
      timerResEl.className = 'value' + (s.TimerResolutionElevated ? ' warn' : '');
    } else {
      timerResEl.textContent = 'n/a on this platform';
    }

    const energyEl = document.getElementById('energyAudit');
    const issuesEl = document.getElementById('energyIssues');
    if (s.EnergyAudit) {
      const ea = s.EnergyAudit;
      energyEl.textContent = ea.ErrorCount + ' error(s), ' + ea.WarnCount + ' warning(s)';
      energyEl.className = 'value' + (ea.ErrorCount > 0 ? ' danger' : (ea.WarnCount > 0 ? ' warn' : ''));
      if (ea.TopIssues && ea.TopIssues.length) {
        issuesEl.style.display = 'block';
        issuesEl.innerHTML = ea.TopIssues.slice(0, 5).map(i =>
          '&bull; [' + i.Severity + '] ' + i.Category + ': ' + i.Name + (i.Count > 1 ? ' (x' + i.Count + ')' : '')
        ).join('<br>');
      } else {
        issuesEl.style.display = 'none';
      }
    } else {
      energyEl.textContent = 'not run yet';
      issuesEl.style.display = 'none';
    }

    document.getElementById('version').textContent = s.Version || 'dev';
    document.getElementById('footerVersion').textContent = s.Version || 'dev';
    document.getElementById('backend').textContent = s.Backend || '-';
    document.getElementById('updated').textContent = fmtAgo(s.UpdatedAt);

    const banner = document.getElementById('updateBanner');
    if (s.UpdateAvailable) {
      banner.textContent = 'Update available: ' + s.UpdateAvailable + ' - click "Check for updates" below to install.';
      banner.classList.add('show');
    } else {
      banner.classList.remove('show');
    }
  } catch (e) {
    document.getElementById('statusSub').textContent = 'daemon not responding';
  }
}

async function toggleEnabled() {
  if (currentEnabled === null) return;
  const next = !currentEnabled;
  document.getElementById('toggleBtn').disabled = true;
  try {
    await fetch('/api/enabled', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ enabled: next })
    });
    currentEnabled = next;
  } finally {
    document.getElementById('toggleBtn').disabled = false;
    refresh();
  }
}

async function checkForUpdate() {
  const btn = document.getElementById('checkBtn');
  btn.disabled = true;
  btn.textContent = 'Checking...';
  try {
    const res = await fetch('/api/check-update', { method: 'POST' });
    const r = await res.json();
    if (r.error) {
      btn.textContent = 'Check failed - try again';
    } else if (r.available) {
      btn.textContent = 'Installing ' + r.tag + '...';
      await fetch('/api/apply-update', { method: 'POST' });
      btn.textContent = 'Update applying - restarting shortly';
    } else {
      btn.textContent = 'Up to date (' + r.current + ')';
    }
  } catch (e) {
    btn.textContent = 'Check failed - try again';
  } finally {
    setTimeout(() => { btn.disabled = false; btn.textContent = 'Check for updates'; }, 4000);
  }
}

refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
